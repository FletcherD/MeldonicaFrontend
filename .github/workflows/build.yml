name: Cross-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dildonicaFrontend
            asset_name: dildonicaFrontend-linux-x86_64
          - name: Build Windows x86_64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            artifact_name: dildonicaFrontend.exe
            asset_name: dildonicaFrontend-windows-x86_64.exe
          - name: Build macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: dildonicaFrontend
            asset_name: dildonicaFrontend-macos-intel
          - name: Build macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dildonicaFrontend
            asset_name: dildonicaFrontend-macos-arm64

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Install Linux build dependencies
      if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        sudo apt update
        sudo apt install -y \
          pkg-config \
          libdbus-1-dev \
          libfontconfig1-dev \
          libasound2-dev \
          libxcb-render0-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxkbcommon-dev \
          libssl-dev

    - name: Install cross-compilation dependencies (Windows)
      if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt update
        sudo apt install -y gcc-mingw-w64-x86-64
    
    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build
      run: cargo build --release --target ${{ matrix.target }}
    
    - name: Run tests (native target only)
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo test --release
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
    
    - name: Upload release assets
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: application/octet-stream

  build-headless-variants:
    name: Build headless variants
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache cargo dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ubuntu-headless-cargo-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Build headless documentation
      run: |
        echo "# DildonicaFrontend Release Builds" > BUILD_INFO.md
        echo "" >> BUILD_INFO.md
        echo "## Usage:" >> BUILD_INFO.md
        echo "- **GUI Mode**: Run the executable normally" >> BUILD_INFO.md
        echo "- **Headless Mode**: Run with \`--headless\` or \`-l\` flag for MIDI-only operation" >> BUILD_INFO.md
        echo "" >> BUILD_INFO.md
        echo "## Platforms:" >> BUILD_INFO.md
        echo "- **Linux**: x86_64 native build" >> BUILD_INFO.md
        echo "- **Windows**: x86_64 build (GNU toolchain)" >> BUILD_INFO.md
        echo "- **macOS**: Intel and Apple Silicon builds" >> BUILD_INFO.md
    
    - name: Upload build info
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: BUILD_INFO.md
        asset_name: BUILD_INFO.md
        asset_content_type: text/markdown
